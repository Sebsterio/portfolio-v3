name: Enforce main source branch

on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure PR comes from dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only 'dev' may merge into 'main'"
            exit 1
          fi
