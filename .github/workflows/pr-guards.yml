name: pr-guards

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  guard-main-source:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Allow only this repo's dev -> main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs into main must come from dev"
            exit 1
          fi

          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "PRs into main must come from this repository's dev branch"
            exit 1
          fi

  guard-dev-source:
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Allow only task branches -> dev
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "PRs into dev must come from this repository"
            exit 1
          fi

          case "${{ github.head_ref }}" in
            task/*)
              ;;
            *)
              echo "PRs into dev must come from task/*"
              exit 1
              ;;
          esac
